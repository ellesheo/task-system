services:
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      - users-service
      - tasks-service
      - notifications-service
    restart: unless-stopped
    networks:
      - app-network

  users-service:
    build: ./users-service
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=app;Username=postgres;Password=1234"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  tasks-service:
    build: ./tasks-service
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=app;Username=postgres;Password=1234"
      Services__Users: "http://users-service:8080"
      Services__Notifications: "http://notifications-service:8080"
      ASPNETCORE_URLS: "http://+:8080"
    depends_on:
      db:
        condition: service_healthy
      users-service:
        condition: service_started
      notifications-service:
        condition: service_started
    restart: unless-stopped
    networks:
      - app-network

  notifications-service:
    build: ./notifications-service
    environment:
      ASPNETCORE_URLS: "http://+:8080"
    restart: unless-stopped
    networks:
      - app-network

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge
